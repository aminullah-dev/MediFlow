[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mediflow"
version = "0.2.0"
description = "MediFlow — Offline Clinic & Hospital Management System for Afghanistan"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "MediFlow" }]
dependencies = [
    # Web UI (mediflow.web)
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    # Desktop UI (mediflow.ui)
    "PySide6>=6.7",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "reportlab>=4.1",
    "openpyxl>=3.1",
    "cryptography>=42.0",
    "qrcode[pil]>=7.4",
    "python-barcode>=0.15",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "httpx2>=2.0",          # starlette TestClient transport

    "ruff==0.16.5",
    "black>=24.0",
    "mypy>=1.10",
]

[project.scripts]
mediflow = "mediflow.__main__:main"

[tool.setuptools.packages.find]
include = ["mediflow*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pin the rule set explicitly.
#
# Ruff's *default* selection is not a stable contract: it widens between
# releases, and CI installs ruff unpinned. On 2026-07-24 a newer ruff started
# enforcing rules this project had never opted into and the lint job went red
# across six consecutive runs without a single line of code changing. Naming
# the rules here means a ruff upgrade can no longer break the build on its own.
#
# Everything selected below currently passes with zero violations.
select = [
    "E4", "E7", "E9",  # pycodestyle: imports, statements, runtime errors
    "F",               # pyflakes
    "C4",              # flake8-comprehensions
    "RET",             # flake8-return
    "PIE",             # flake8-pie
    "ISC",             # implicit string concatenation
    "ICN",             # import conventions
    "RSE",             # raise statements
    "TID",             # tidy imports
    "ASYNC",           # async correctness (the FastAPI web UI)
    "EXE",             # shebang / executable-bit consistency
    "INT",             # gettext — this app is trilingual
    "LOG", "G",        # logging correctness; the audit trail depends on it
    "FA",              # future annotations
    "DTZ",             # tz-naive datetime — payroll periods and Solar Hijri dates
    "I",               # import sorting
    "UP",              # outdated syntax
    "RUF",             # ruff-specific
    "B",               # bugbear
    "W",               # pycodestyle warnings
    "FURB",            # modernisation
    "ERA",             # commented-out code
    "T20",             # stray print()
    "N",               # naming conventions
]

# Deliberately NOT enabled yet. These are real findings, not noise — the count
# after each name is what `ruff check mediflow tests --select <rule>` reports
# today. Turn them on one family at a time, fix, and move the line up into
# `select` above — DTZ was cleared this way.
#
#   SIM   5  simplifiable code
#   A     2  builtin shadowing
#   C90   2  complexity
#   SLF   1  private-member access
#   PTH   8  os.path -> pathlib
#   ARG  13  unused arguments
#   S   204  bandit security; many are test-only asserts, needs triage
#   PL  132  pylint
#   TRY  94  exception style
#   EM   94  exception message literals

ignore = [
    # This application's UI strings are Dari and Pashto. RUF001/RUF002 exist to
    # catch homoglyph attacks in ASCII source; here they fire on every Arabic
    # letter — "String contains ambiguous ا (ARABIC LETTER ALEF). Did you mean
    # l?" — including inside core/keyboard.py, the Persian keyboard-layout
    # module. Acting on them would corrupt the translations.
    "RUF001",
    "RUF002",
    # ERA001 flags the header comments that document tuple shapes, e.g.
    # "# (name, code, sample_type, reference_range, unit)" above a table of
    # seed rows. That is documentation, not dead code.
    "ERA001",
    # UP042 rewrites `class X(str, Enum)` to `StrEnum`. Ruff marks the fix
    # unsafe, and it is: str() of a member changes, which is exactly the sort
    # of value that reaches a database column or a printed report. Worth doing
    # deliberately, with the enum call sites reviewed — not as a lint sweep.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# Tests may use assert and fixture-style shadowing freely.
"tests/**" = ["S101", "ARG001", "ARG002"]
# Qt calls this override by name; renaming it silently stops event filtering.
"mediflow/ui/dialogs/login_dialog.py" = ["N802"]
# ctypes structures deliberately mirror the Win32 names they map onto.
"mediflow/core/windows_identity.py" = ["N801"]
# Console entry points: print() is the output, not a stray debug statement.
"mediflow/app.py" = ["T201"]
"mediflow/web/__main__.py" = ["T201"]
# Base is re-exported only after the loop above has imported every model
# module, so SQLAlchemy sees a fully populated registry. The order is the
# point; moving the import to the top would defeat it.
"mediflow/data/models/__init__.py" = ["E402"]
# _PASSWORD_EXEMPT is a constant that happens to live inside create_app().
# Lower-casing it would suggest it is mutable, and this particular set decides
# what a user holding a temporary password may still reach.
"mediflow/web/server.py" = ["N806"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
