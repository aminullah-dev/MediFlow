[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mediflow"
version = "0.2.0"
description = "MediFlow — Offline Clinic & Hospital Management System for Afghanistan"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "MediFlow" }]
dependencies = [
    # Web UI (mediflow.web)
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    # Desktop UI (mediflow.ui)
    "PySide6>=6.7",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "reportlab>=4.1",
    "openpyxl>=3.1",
    "cryptography>=42.0",
    "qrcode[pil]>=7.4",
    "python-barcode>=0.15",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "httpx2>=2.0",          # starlette TestClient transport

    "ruff==0.16.5",
    "black>=24.0",
    "mypy>=1.10",
]

[project.scripts]
mediflow = "mediflow.__main__:main"

[tool.setuptools.packages.find]
include = ["mediflow*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pin the rule set explicitly.
#
# Ruff's *default* selection is not a stable contract: it widens between
# releases, and CI installs ruff unpinned. On 2026-07-24 a newer ruff started
# enforcing rules this project had never opted into and the lint job went red
# across six consecutive runs without a single line of code changing. Naming
# the rules here means a ruff upgrade can no longer break the build on its own.
#
# Everything selected below currently passes with zero violations.
select = [
    "E4", "E7", "E9",  # pycodestyle: imports, statements, runtime errors
    "F",               # pyflakes
    "C4",              # flake8-comprehensions
    "RET",             # flake8-return
    "PIE",             # flake8-pie
    "ISC",             # implicit string concatenation
    "ICN",             # import conventions
    "RSE",             # raise statements
    "TID",             # tidy imports
    "ASYNC",           # async correctness (the FastAPI web UI)
    "EXE",             # shebang / executable-bit consistency
    "INT",             # gettext — this app is trilingual
    "LOG", "G",        # logging correctness; the audit trail depends on it
    "FA",              # future annotations
    "DTZ",             # tz-naive datetime — payroll periods and Solar Hijri dates
]

# Deliberately NOT enabled yet. These are real findings, not noise — the count
# after each name is what `ruff check mediflow tests --select <rule>` reports
# today. Turn them on one family at a time, fix, and move the line up into
# `select` above — DTZ was cleared this way.
#
#   I    26  unsorted imports        — all auto-fixable (`ruff check --fix`)
#   UP   61  outdated syntax         — nearly all auto-fixable
#   RUF  35  ruff-specific           — mostly auto-fixable
#   BLE   5  blind `except:`
#   B     3  bugbear
#   SIM   5  simplifiable code
#   N     4  naming conventions
#   ERA   4  commented-out code
#   T20   3  stray print()
#   A     2  builtin shadowing
#   FURB  2  modernisation
#   C90   2  complexity
#   W     1  whitespace
#   SLF   1  private-member access
#   PTH   8  os.path -> pathlib
#   ARG  13  unused arguments
#   S   204  bandit security; many are test-only asserts, needs triage
#   PL  132  pylint
#   TRY  94  exception style
#   EM   94  exception message literals

[tool.ruff.lint.per-file-ignores]
# Tests may use assert and fixture-style shadowing freely.
"tests/**" = ["S101", "ARG001", "ARG002"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
