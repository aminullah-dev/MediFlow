[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mediflow"
version = "0.2.0"
description = "MediFlow — Offline Clinic & Hospital Management System for Afghanistan"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "MediFlow" }]
dependencies = [
    # Web UI (mediflow.web)
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    # Desktop UI (mediflow.ui)
    "PySide6>=6.7",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "reportlab>=4.1",
    "openpyxl>=3.1",
    "cryptography>=42.0",
    "qrcode[pil]>=7.4",
    "python-barcode>=0.15",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "httpx2>=2.0",          # starlette TestClient transport

    "ruff>=0.5",
    "black>=24.0",
    "mypy>=1.10",
]

[project.scripts]
mediflow = "mediflow.__main__:main"

[tool.setuptools.packages.find]
include = ["mediflow*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
