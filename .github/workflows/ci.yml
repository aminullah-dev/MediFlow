name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    # MediFlow is a Windows desktop product, and mediflow/core/dpapi.py imports
    # ctypes.wintypes, which raises on non-Windows. Testing on the target OS
    # keeps CI faithful and sidesteps that entirely.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # Mirrors requires-python = ">=3.11" in pyproject.toml.
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        # The suite is headless (no widgets are constructed), but the offscreen
        # platform keeps any future GUI test from needing a display.
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.16.5   # pinned: see [tool.ruff.lint] in pyproject.toml

      # Lint only — never imports the package, so the Windows-only modules and
      # the Qt runtime libraries are irrelevant here.
      - name: Ruff
        run: ruff check mediflow tests
